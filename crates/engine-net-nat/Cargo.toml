[package]
name = "engine-net-nat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "engine-relay-server"
path = "src/bin/engine-relay-server.rs"

[dependencies]
engine-net-quic = { path = "../engine-net-quic" }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
engine-network = { path = "../engine-network" }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }

[lints]
workspace = true
