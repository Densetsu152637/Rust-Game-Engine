[package]
name = "programmable-world"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
desktop = ["dep:engine-desktop"]

[dependencies]
engine-core = { path = "../../crates/engine-core" }
engine-project = { path = "../../crates/engine-project" }
engine-desktop = { path = "../../crates/engine-desktop", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "programmable-world"
path = "src/main.rs"
