name: CI

# Required jobs run for every pull request and for pushes to main. They are not
# path filtered, so required checks cannot be left Pending.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner images are pinned to what the *-latest labels resolved to on
# 2026-11-02 (run 40858178120) so image changes cannot silently alter disk or
# toolchain headroom. Bump them deliberately.
defaults:
  run:
    # Explicit bash enables pipefail, so a failing cargo test cannot be hidden
    # by the tee pipeline. Windows runners use Git for Windows bash.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  # Hosted runners have limited disk. CI never debugs, so drop debug info
  # (overrides the workspace dev line tables); test inherits dev.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Aggregate number of passed tests required across the three workspace test
  # jobs and the standalone example crates, plus a minimum for each OS so one
  # platform cannot regress behind the others. Calibrated from run 42337639780
  # (Windows 6066, Linux 6060, macOS 6055, examples 102). Ignored tests (real
  # GPU, audio device and interactive native UI) never count as passed.
  MINIMUM_PASSED_TESTS: "18000"
  MINIMUM_PASSED_TESTS_WINDOWS: "6000"
  MINIMUM_PASSED_TESTS_LINUX: "6000"
  MINIMUM_PASSED_TESTS_MACOS: "6000"

jobs:
  lint:
    name: Format and Clippy (Windows)
    runs-on: windows-2025-vs2026
    # Each standalone example crate compiles its own dependency graph.
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-toolchain.sh
      - name: Move temporary files to the D drive
        # C has about 30 GB free and D about 147 GB. The target directory is already on D;
        # tests that spawn Cargo builds write into TEMP, which defaults to C.
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            examples/desktop-2d
            examples/first-project
            examples/native-extension
            examples/programmable-world
            assets/scripts/moving_entity
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Disk space (before build)
        if: ${{ always() }}
        run: df -h
      - name: cargo fmt (workspace)
        run: bash scripts/ci/fmt-check.sh
      - name: cargo fmt (standalone example crates)
        run: |
          for crate in examples/desktop-2d examples/first-project examples/native-extension examples/programmable-world assets/scripts/moving_entity; do
            cargo fmt --check --manifest-path "$crate/Cargo.toml"
          done
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo clippy (standalone example crates)
        run: |
          for crate in examples/desktop-2d examples/first-project examples/native-extension examples/programmable-world assets/scripts/moving_entity; do
            cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
          done
      # Compiles the whole template, including src/main.rs, against this checkout.
      - name: cargo check (game template)
        run: bash scripts/ci/check-template.sh
      # The Steam variant is opt-in (docs/steam.md). The Linux and macOS rows join after the
      # platform stages.
      - name: cargo clippy (Steam feature)
        run: cargo clippy -p engine-steam --features steam,online --all-targets --locked -- -D warnings
      - name: cargo build (Steam feature)
        run: cargo build -p engine-steam --features steam --all-targets --locked
      - name: cargo check (facade Steam feature)
        run: cargo check -p engine --features steam --locked
      # A default build must not contain steamworks. The tree is captured first so a
      # cargo failure fails the step; only grep's exit 1 on zero matches is tolerated.
      - name: Default features exclude steamworks
        run: |
          tree=$(cargo tree -p engine -p engine-desktop -p engine-mcp -p engine-tooling -e normal --locked)
          count=$(printf '%s\n' "$tree" | grep -c steamworks || true)
          echo "steamworks entries in the default dependency tree: $count"
          test -n "$tree"
          test "$count" = "0"
      - name: Disk space (after build)
        if: ${{ always() }}
        run: df -h

  # This job deliberately does not set RUSTFLAGS: engine-tooling tests spawn real
  # Cargo builds that inherit the environment (RUSTFLAGS is part of a generation's
  # build configuration), and their fixtures intentionally compile code with
  # warnings. The lint job already denies warnings for every workspace target.
  workspace-tests:
    name: Workspace tests (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-toolchain.sh
      - name: Move temporary files to the D drive
        # C has about 30 GB free and D about 147 GB. The target directory is already on D;
        # tests that spawn Cargo builds write into TEMP, which defaults to C.
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Disk space (before build)
        if: ${{ always() }}
        run: df -h
      # Tests marked #[ignore] (real GPU, audio device, interactive native UI)
      # are deliberately not run: hosted runners have no such devices.
      - name: cargo test --workspace
        run: cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/workspace.log"
      # examples/pbr-shadows is a data project (no Cargo crate) rendered by the
      # workspace engine-desktop example, which cargo test --workspace builds.
      - name: Validate PBR shadows example project
        run: cargo run --locked -p engine-tooling --bin engine -- project validate examples/pbr-shadows/project.json --no-rust
      # examples/acoustics-showcase is a data project too: a 3D room and a 2D proxy scene.
      - name: Validate acoustics showcase example project
        run: cargo run --locked -p engine-tooling --bin engine -- project validate examples/acoustics-showcase/project.json --no-rust
      - name: Disk space (after build)
        if: ${{ always() }}
        run: df -h
      - name: Count passed tests
        if: ${{ !cancelled() }}
        run: |
          mkdir counts
          bash scripts/ci/test-count.sh count "$RUNNER_TEMP/workspace.log" > counts/workspace-windows.count
          {
            echo "### Workspace tests (Windows)"
            echo
            echo "Passed: $(cat counts/workspace-windows.count)"
            echo
            echo '```text'
            bash scripts/ci/test-count.sh breakdown "$RUNNER_TEMP/workspace.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-count-windows
          path: counts/workspace-windows.count
          if-no-files-found: error

  # Each example is its own Cargo workspace root with a local, uncommitted
  # Cargo.lock, so these jobs resolve dependencies without --locked.
  example-tests:
    name: Example tests (${{ matrix.name }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop-2d
            path: examples/desktop-2d
          - name: first-project
            path: examples/first-project
          - name: native-extension
            path: examples/native-extension
          # Default features exercise real simulation/UI/extraction without a GPU.
          - name: programmable-world
            path: examples/programmable-world
          - name: moving-entity
            path: assets/scripts/moving_entity
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.path }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate desktop-2d fixture assets
        if: ${{ matrix.name == 'desktop-2d' }}
        run: python examples/desktop-2d/tools/validate_fixture.py
      - name: cargo test (${{ matrix.path }})
        env:
          MANIFEST: ${{ matrix.path }}/Cargo.toml
        run: cargo test --manifest-path "$MANIFEST" 2>&1 | tee "$RUNNER_TEMP/example.log"
      - name: Count passed tests
        if: ${{ !cancelled() }}
        env:
          COUNT_FILE: counts/example-${{ matrix.name }}.count
        run: |
          mkdir counts
          bash scripts/ci/test-count.sh count "$RUNNER_TEMP/example.log" > "$COUNT_FILE"
          {
            echo "### Example tests: ${{ matrix.name }}"
            echo
            echo "Passed: $(cat "$COUNT_FILE")"
            echo
            echo '```text'
            bash scripts/ci/test-count.sh breakdown "$RUNNER_TEMP/example.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-count-example-${{ matrix.name }}
          path: counts/example-${{ matrix.name }}.count
          if-no-files-found: error

  test-count-gate:
    name: Test count gate
    needs: [workspace-tests, example-tests, linux-tests, macos-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-count-*
          merge-multiple: true
          path: counts
      # Each OS file is named explicitly with its own minimum, so a missing
      # artifact fails the gate instead of shrinking the sum. Every example has its
      # own file and minimum too: a new example must be added to this list, or its
      # tests are not gated. Minimums sit slightly below the counts of run
      # 42337639780 (desktop-2d 77, first-project 13, moving-entity 10,
      # native-extension 1, programmable-world 1).
      - name: Require the minimum number of passed tests
        run: |
          set -o pipefail
          ls -l counts
          bash scripts/ci/test-count.sh gate "$MINIMUM_PASSED_TESTS" \
            "counts/workspace-windows.count:$MINIMUM_PASSED_TESTS_WINDOWS" \
            "counts/workspace-linux.count:$MINIMUM_PASSED_TESTS_LINUX" \
            "counts/workspace-macos.count:$MINIMUM_PASSED_TESTS_MACOS" \
            counts/example-desktop-2d.count:70 \
            counts/example-first-project.count:12 \
            counts/example-moving-entity.count:9 \
            counts/example-native-extension.count:1 \
            counts/example-programmable-world.count:1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Portable crates and editor logic on Linux. CI does not open the interactive
  # editor; legacy Win32 controls and their tests remain cfg(windows).
  # The apt packages provide the native audio (ALSA), gamepad
  # (udev) and window-system development libraries the desktop crates link.
  linux-tests:
    name: Workspace tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
      - name: Disk space (before build)
        if: ${{ always() }}
        run: df -h
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test --workspace
        run: cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/workspace.log"
      # Packages a real project as tar.gz and zip with the workspace CLI and checks each
      # from a fresh extraction on Linux (scripts/package/smoke-archive.sh, shared with
      # the release workflow): the exec bit must survive, and the runtime must start with
      # no project argument (it finds game/project.json beside itself) and through
      # run.sh. The dev profile and the shared native target directory reuse the
      # generation build output the workspace tests produced.
      - name: Package smoke test (tar.gz and zip)
        if: ${{ !cancelled() }}
        run: |
          export ENGINE_NATIVE_TARGET_DIR="$PWD/target/native-generation-shared"
          out="$RUNNER_TEMP/package-smoke"
          rm -rf "$out"
          mkdir -p "$out"
          cargo run --locked -q -p engine-tooling --bin engine -- \
            project package examples/first-project/project.json "$out/first-project.tar.gz" \
            --profile dev --format tar.gz
          bash scripts/package/smoke-archive.sh "$out/first-project.tar.gz" "$out/extract"
          # The same generation as a zip: the only zip-on-Unix check (unzip is
          # preinstalled on ubuntu-24.04 runners; the fallback is cheap insurance).
          command -v unzip >/dev/null || sudo apt-get install --no-install-recommends -y unzip
          cargo run --locked -q -p engine-tooling --bin engine -- \
            project package examples/first-project/project.json "$out/first-project.zip" \
            --profile dev --format zip
          bash scripts/package/smoke-archive.sh "$out/first-project.zip" "$out/extract-zip"
          rm -rf "$out"
      - name: Check standalone desktop entry points
        if: ${{ !cancelled() }}
        run: bash scripts/ci/check-desktop-examples.sh
      - name: Disk space (after build)
        if: ${{ always() }}
        run: df -h
      - name: Count passed tests
        if: ${{ !cancelled() }}
        run: |
          mkdir counts
          bash scripts/ci/test-count.sh count "$RUNNER_TEMP/workspace.log" > counts/workspace-linux.count
          {
            echo "### Workspace tests (Linux)"
            echo
            echo "Passed: $(cat counts/workspace-linux.count)"
            echo
            echo '```text'
            bash scripts/ci/test-count.sh breakdown "$RUNNER_TEMP/workspace.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-count-linux
          path: counts/workspace-linux.count
          if-no-files-found: error

  # Builds a real AppImage on the oldest supported glibc (ubuntu-22.04) and runs it.
  # The packaging tests and AppDir generation run on every OS in the workspace test
  # jobs; this job adds the real appimagetool run. appimagetool and the type2
  # runtime are pinned to tagged releases (never `continuous`) and checked against
  # recorded checksums, so the runtime is never downloaded at package time. Nothing
  # is uploaded (release publishing is a separate workflow).
  # appimagetool 1.9.1:
  #   https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  # type2 runtime 20251108:
  #   https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  appimage:
    name: AppImage (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
      - name: Disk space (before build)
        if: ${{ always() }}
        run: df -h
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev \
            desktop-file-utils
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Download pinned appimagetool and type2 runtime
        run: |
          # The pins and their checksums live in the script, which P9 reuses.
          fetched=$(bash scripts/package/fetch-appimagetool.sh "$RUNNER_TEMP/appimage-tools")
          echo "ENGINE_APPIMAGETOOL=$(sed -n 1p <<<"$fetched")" >> "$GITHUB_ENV"
          echo "ENGINE_APPIMAGE_RUNTIME=$(sed -n 2p <<<"$fetched")" >> "$GITHUB_ENV"
      - name: Package examples/first-project as an AppImage
        run: |
          out="$RUNNER_TEMP/appimage-smoke"
          rm -rf "$out"
          mkdir -p "$out"
          cargo run --locked -q -p engine-tooling --bin engine -- \
            project package examples/first-project/project.json "$out/first-project.AppImage" \
            --profile dev --format appimage
          ls -la "$out"
      # scripts/package/smoke-appimage.sh (shared with the release workflow) checks that
      # no .zsync file was left behind and runs the image by extracting it (the runners
      # have no FUSE) from an unrelated working directory, where the runtime finds
      # game/project.json inside the image through AppRun with no project argument; it
      # then checks the extracted AppDir (desktop-file-validate included) and runs
      # AppRun from a read-only tree with no inherited APPDIR.
      - name: Smoke test the AppImage
        run: bash scripts/package/smoke-appimage.sh "$RUNNER_TEMP/appimage-smoke/first-project.AppImage" "$RUNNER_TEMP/appimage-smoke/work" first-project
      - name: Clean up
        if: ${{ always() }}
        run: |
          chmod -R u+w "$RUNNER_TEMP/appimage-smoke" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/appimage-smoke" "$RUNNER_TEMP/appimage-tools"
      - name: Disk space (after build)
        if: ${{ always() }}
        run: df -h

  macos-tests:
    name: Workspace tests (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Disk space (before build)
        if: ${{ always() }}
        run: df -h
      - name: cargo test --workspace
        run: cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/workspace.log"
      - name: Check standalone desktop entry points
        if: ${{ !cancelled() }}
        run: bash scripts/ci/check-desktop-examples.sh
      - name: Disk space (after build)
        if: ${{ always() }}
        run: df -h
      - name: Count passed tests
        if: ${{ !cancelled() }}
        run: |
          mkdir counts
          bash scripts/ci/test-count.sh count "$RUNNER_TEMP/workspace.log" > counts/workspace-macos.count
          {
            echo "### Workspace tests (macOS)"
            echo
            echo "Passed: $(cat counts/workspace-macos.count)"
            echo
            echo '```text'
            bash scripts/ci/test-count.sh breakdown "$RUNNER_TEMP/workspace.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-count-macos
          path: counts/workspace-macos.count
          if-no-files-found: error

  # Packages the macOS .app bundle for real: both Apple Rust targets are built and
  # joined with lipo, the bundle is ad-hoc signed and then inspected and started.
  # Unit tests cover the layout and file generators on every OS; only this job runs
  # lipo, codesign and the bundle itself. Not part of the test-count gate.
  macos-app:
    name: App bundle (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-toolchain.sh
      - name: Install both Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Disk space (before build)
        if: ${{ always() }}
        run: df -h
      - name: Package examples/first-project as an app bundle
        id: package
        # Shared with the rust-cache path, as in linux-tests, so both Apple
        # generations are saved on main.
        env:
          ENGINE_NATIVE_TARGET_DIR: ${{ github.workspace }}/target/native-generation-shared
        run: |
          out="$RUNNER_TEMP/app-smoke"
          rm -rf "$out"
          mkdir -p "$out"
          cargo run --locked -q -p engine-tooling --bin engine -- \
            project package examples/first-project/project.json "$out/First Project.app" \
            --profile dev --format app
          ls -laR "$out/First Project.app/Contents"
      # scripts/package/smoke-app.sh (shared with the release workflow) runs these phases,
      # each one even when an earlier one failed: the bundle files and both slices
      # (plutil, lipo), the code signature, the resolve-only and headless launches from
      # an unrelated directory, and the Rosetta run of the x86_64 slice when available.
      - name: Smoke test the app bundle
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: bash scripts/package/smoke-app.sh "$RUNNER_TEMP/app-smoke/First Project.app" first-project
      - name: Clean up
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/app-smoke"
      - name: Disk space (after build)
        if: ${{ always() }}
        run: df -h

  wasm-portable-check:
    name: Portable library compile (WebAssembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install-toolchain.sh
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm-portable
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A compile check is not a browser host or a runnable WebAssembly game.
      - name: Check portable library boundaries
        run: cargo check --locked --target wasm32-unknown-unknown -p engine-core -p engine-ecs -p engine-render -p engine-platform
