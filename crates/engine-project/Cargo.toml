[package]
name = "engine-project"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-assets = { path = "../engine-assets" }
engine-network = { path = "../engine-network" }
engine-net-predict = { path = "../engine-net-predict" }
engine-net-quic = { path = "../engine-net-quic" }
engine-net-replication = { path = "../engine-net-replication" }
engine-net-voice = { path = "../engine-net-voice" }
engine-core = { path = "../engine-core" }
engine-destruction = { path = "../engine-destruction" }
engine-fluids = { path = "../engine-fluids" }
engine-audio = { path = "../engine-audio" }
engine-video = { path = "../engine-video" }
engine-acoustics = { path = "../engine-acoustics" }
engine-physics = { path = "../engine-physics" }
engine-animation = { path = "../engine-animation" }
engine-sequencer = { path = "../engine-sequencer" }
engine-navigation = { path = "../engine-navigation" }
engine-graph = { path = "../engine-graph" }
engine-material-graph = { path = "../engine-material-graph" }
engine-ai = { path = "../engine-ai" }
engine-locale = { path = "../engine-locale" }
engine-text = { path = "../engine-text" }
unicode-linebreak = "=0.1.5"
engine-xpbd = { path = "../engine-xpbd" }
bevy_ecs = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
blake3 = "1"
tempfile = "3"
fs2 = "0.4"
glam.workspace = true
# Flexbox, CSS grid and absolute layout for retained game UI (MIT).
taffy = { version = "=0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
# Test fonts (already used by engine-text tests).
epaint_default_fonts = { version = "=0.37.0", features = ["monochrome_emoji_fonts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
engine-ml = { path = "../engine-ml" }
