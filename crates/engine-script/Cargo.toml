[package]
name = "engine-script"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Pure script core: typed values, host function registry, budgets and traps, and the script_graph visual-scripting VM"

[features]
default = ["text"]
text = ["dep:rhai"]

[dependencies]
engine-graph = { path = "../engine-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "=1.26.1", default-features = false, features = ["std", "sync", "no_time", "no_custom_syntax", "no_optimize", "only_i64"], optional = true }

[lints]
workspace = true
