[package]
name = "engine-acoustics-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "GPU ray-query and compute propagation backends for engine-acoustics (contract skeleton)"

[dependencies]
engine-acoustics = { path = "../engine-acoustics" }

# Opts out of `[workspace.lints]` (which forbids unsafe code), as engine-dlss does.
# The crate instead denies unsafe code: the single audited
# `#[allow(unsafe_code)]` function that will create wgpu's
# `ExperimentalFeatures::enabled()` token (docs/spatial-audio-design.md section 6.3,
# approved by root) is the only place the lint may be lifted. `forbid` is not used
# because it cannot be locally allowed.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
