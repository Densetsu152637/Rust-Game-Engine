[package]
name = "programmable-world"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
desktop = ["engine/desktop"]

[dependencies]
engine = { path = "../../crates/engine", default-features = false, features = ["text-scripting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "programmable-world"
path = "src/main.rs"
