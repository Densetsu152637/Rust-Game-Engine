[package]
name = "engine-dlss"
version = "0.1.0"
edition = "2024"
description = "Optional NVIDIA NGX super resolution for native Vulkan rendering"

[features]
default = []
ngx-vulkan = ["dep:wgpu", "dep:ash", "dep:pollster"]

[dependencies]
wgpu = { workspace = true, optional = true, features = ["std", "vulkan", "wgsl", "parking_lot"] }
ash = { version = "0.38", optional = true }
pollster = { version = "0.4", optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
pollster = "0.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
