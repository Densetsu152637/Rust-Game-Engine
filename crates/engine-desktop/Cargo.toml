[package]
name = "engine-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bevy_ecs.workspace = true
bytemuck = { version = "1", features = ["derive"] }
engine-acoustics = { path = "../engine-acoustics" }
engine-acoustics-gpu = { path = "../engine-acoustics-gpu" }
engine-core = { path = "../engine-core" }
engine-audio = { path = "../engine-audio" }
engine-dlss = { path = "../engine-dlss", optional = true }
engine-project = { path = "../engine-project" }
engine-render = { path = "../engine-render" }
engine-render-wgpu = { path = "../engine-render-wgpu" }
gilrs = "=0.11.2"
glam.workspace = true
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
winit = "=0.30.13"

[features]
default = []
# DLSS Super Resolution through NGX on Vulkan. Needs NGX_SDK_DIR and
# VULKAN_HEADERS_DIR at build time; without them the build still succeeds and
# DLSS requests report the missing SDK.
dlss = ["dep:engine-dlss", "engine-dlss/ngx-vulkan"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }
tempfile = "3"
