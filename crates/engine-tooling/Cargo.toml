[package]
name = "engine-tooling"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
process-wrap = { version = "=10.0.1", features = ["std"] }
base64.workspace = true
engine-log.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
engine-audio = { path = "../engine-audio" }
engine-project = { path = "../engine-project" }
engine-core = { path = "../engine-core" }
engine-platform = { path = "../engine-platform" }
engine-desktop = { path = "../engine-desktop" }
engine-editor = { path = "../engine-editor" }
engine-mcp = { path = "../engine-mcp" }
engine-steam = { path = "../engine-steam" }
tempfile = "3"
# Archive output for `project package --format zip|tar.gz`. Default features off: no
# extended attributes, encryption or extra codecs.
tar = { version = "0.4", default-features = false }
flate2 = "1"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }

[features]
default = []
# Real Steamworks backend for runtime builds. Needs the steam_api library next to
# the executable; without it Steam settings in a project report "not compiled".
steam = ["engine-steam/steam"]

[[bin]]
name = "engine"
path = "src/main.rs"
