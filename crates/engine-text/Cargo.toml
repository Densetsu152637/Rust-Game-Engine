[package]
name = "engine-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "CPU text engine: font loading, fallback, shaping, bidi, line breaking, rich-text markup, caret geometry and glyph atlases"

[dependencies]
ab_glyph_rasterizer = "=0.1.10"
glam = { workspace = true }
harfrust = "=0.12.0"
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
unicode-bidi = "=0.3.18"
unicode-linebreak = "=0.1.5"
unicode-script = "=0.5.7"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
epaint_default_fonts = { version = "=0.37.0", features = ["monochrome_emoji_fonts"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }
png = "=0.18.1"

[lints]
workspace = true
