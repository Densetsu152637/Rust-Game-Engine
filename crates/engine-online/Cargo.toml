[package]
name = "engine-online"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Self-hostable online services: certificate-bound auth tokens, lobby, matchmaking and host migration"

[lib]
name = "engine_online"
path = "src/lib.rs"

[[bin]]
name = "engine-online-server"
path = "src/bin/engine-online-server.rs"

[dependencies]
base64 = "=0.22.1"
engine-net-quic = { path = "../engine-net-quic" }
engine-network = { path = "../engine-network" }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
zeroize = "=1.9.1"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }

[lints]
workspace = true
