[package]
name = "engine-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
# Screen-reader bridge: the accessibility tree types and the winit adapter for
# UI Automation (Windows), NSAccessibility (macOS) and AT-SPI over zbus (Linux).
# Both Apache-2.0 / pure Rust; accesskit matches the version already in the lock.
accesskit = "=0.25.1"
accesskit_winit = "=0.34.1"
anyhow = "1"
# System clipboard for text input copy/cut/paste (MIT OR Apache-2.0); optional.
arboard = { version = "=3.7.0", optional = true, default-features = false }
bevy_ecs.workspace = true
bytemuck = { version = "1", features = ["derive"] }
engine-acoustics = { path = "../engine-acoustics" }
engine-acoustics-gpu = { path = "../engine-acoustics-gpu" }
engine-core = { path = "../engine-core" }
engine-audio = { path = "../engine-audio" }
engine-dlss = { path = "../engine-dlss", optional = true }
engine-physics-render = { path = "../engine-physics-render" }
engine-project = { path = "../engine-project" }
engine-render = { path = "../engine-render" }
engine-render-pipeline = { path = "../engine-render-pipeline" }
engine-render-rt = { path = "../engine-render-rt" }
engine-render-wgpu = { path = "../engine-render-wgpu" }
engine-world-render = { path = "../engine-world-render" }
gilrs = "=0.11.2"
glam.workspace = true
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
winit = "=0.30.13"

[features]
default = []
# Copy, cut and paste in game text inputs use the operating system clipboard instead
# of the process-local in-memory clipboard.
system-clipboard = ["dep:arboard"]
# DLSS Super Resolution through NGX on Vulkan. Needs NGX_SDK_DIR and
# VULKAN_HEADERS_DIR at build time; without them the build still succeeds and
# DLSS requests report the missing SDK.
dlss = ["dep:engine-dlss", "engine-dlss/ngx-vulkan"]

[dev-dependencies]
# Terrain assets for the default render feature tests (workspace crate).
engine-terrain = { path = "../engine-terrain" }
# Test fonts for the TrueType text GPU test (already used by other crates).
epaint_default_fonts = "=0.37.0"
image = { version = "0.25", default-features = false, features = ["png"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }
serde_json = "1"
tempfile = "3"
