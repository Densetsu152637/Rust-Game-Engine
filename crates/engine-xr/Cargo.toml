[package]
name = "engine-xr"
version = "0.1.0"
edition = "2024"
description = "PC VR through OpenXR: runtime discovery, session lifecycle, action input, tracking, haptics and wgpu stereo swapchains"

[dependencies]
bevy_ecs.workspace = true
engine-project = { path = "../engine-project" }
glam.workspace = true
libloading = "=0.8.9"
openxr = { version = "=0.22.0", default-features = false }
serde_json = "1"
wgpu = { workspace = true, features = ["std", "vulkan", "wgsl", "parking_lot"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
ash = "=0.38.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
