[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.104"
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "backtrace"] }
glam = "=0.34.1"
engine-core = { path = "crates/engine-core" }
engine-ecs = { path = "crates/engine-ecs" }
engine-log = { path = "crates/engine-log" }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "registry", "fmt", "env-filter", "ansi"] }
base64 = "0.22"
regex = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
